controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm3_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm1_controller:
  ros__parameters:
    joints: [arm1_joint1, arm1_joint2, arm1_joint3, arm1_joint4, arm1_joint5, arm1_joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm2_controller:
  ros__parameters:
    joints: [arm2_joint1, arm2_joint2, arm2_joint3, arm2_joint4, arm2_joint5, arm2_joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

arm3_controller:
  ros__parameters:
    joints: [arm3_joint1, arm3_joint2, arm3_joint3, arm3_joint4, arm3_joint5, arm3_joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
