# DravenIQ Meta Harness (ex Claude Studio) kitty overlay
#
# Loaded ONLY by the Claude Studio window (hypr-claude-studio launches kitty
# with --config pointing here). Everything else — Alt+Q, drop-term — keeps
# using kitty.conf untouched.
#
# Why this file exists: the studio runs tmux with `set -g mouse on`, so tmux
# grabs the mouse and kitty's normal click/drag handling never fires. kitty
# calls that state "grabbed". kitty ships grabbed-aware fallbacks already
# (shift+drag to select, ctrl+shift+click to open a link), but they are
# undiscoverable chords, so the bindings below add plainer ones.

include kitty.conf

# ---- Links ----
# ctrl+click opens the link under the cursor even while tmux holds the mouse.
# kitty already binds ctrl+shift+left for this; ctrl+left is the shorter
# chord and both are kept so muscle memory either way works.
# The matching `press` discard stops the click also reaching tmux as a
# click-to-move-cursor, which is what makes the open feel clean.
mouse_map ctrl+left        release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left        press   grabbed           discard_event

# ---- Copying a URL ----
# kitty 0.47 has no "copy the URL under the mouse" mouse action — the only
# URL actions are open-style (mouse_handle_click link / mouse_click_url).
# So copying a URL is a keyboard action via the hints kitten instead:
# ctrl+shift+y highlights every URL on screen, and `--program @` puts the
# one you pick on the clipboard rather than opening it.
# NOT ctrl+shift+u — that is kitty's built-in unicode_input, and rebinding
# it here would silently take that away inside the studio.
map ctrl+shift+y kitten hints --type url --program @

# ---- Selection ----
# copy_on_select is inherited from kitty.conf, but tmux owns a plain drag,
# so a normal drag makes a *tmux* selection (which the studio pipes to
# wl-copy separately). shift+drag bypasses tmux and gives kitty's own
# selection + copy_on_select. Both routes now end at the clipboard.
# These are kitty defaults, restated so the behaviour is documented here.
mouse_map shift+left       press   grabbed           mouse_selection normal
mouse_map shift+left       doublepress grabbed       mouse_selection word
mouse_map shift+left       triplepress grabbed       mouse_selection line
