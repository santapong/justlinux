# ~/.config/kitty/kitty.conf
# Tuned for Claude Code / dev work on Kali. Fast, low-resource, easy to tweak.

# ---- Font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Render box/powerline chars crisply
disable_ligatures never

# ---- Performance / resource ----
repaint_delay    10
input_delay      3
sync_to_monitor  yes
# Lower idle CPU: stop blinking after a while
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ---- Scrollback ----
scrollback_lines 10000
# Browse scrollback in a pager (less)
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ---- Mouse / URLs ----
mouse_hide_wait  3.0
url_style        curly
detect_urls      yes
copy_on_select   yes
strip_trailing_spaces smart

# ---- Window / layout ----
remember_window_size  yes
window_padding_width  6
hide_window_decorations no
confirm_os_window_close 0
enabled_layouts splits,stack

# ---- Tabs ----
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ---- Bell ----
enable_audio_bell no
visual_bell_duration 0.0

# ---- Transparency ("glass" look) ----
# 1.0 = solid, 0.0 = invisible. Hyprland blurs whatever shows through.
background_opacity 0.85
dynamic_background_opacity yes

# ---- Theme: Catppuccin Mocha (dark, easy on eyes) ----
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc
cursor                #f5e0dc
cursor_text_color     #1e1e2e
url_color             #f5e0dc
active_border_color   #b4befe
inactive_border_color #6c7086
active_tab_foreground   #11111b
active_tab_background    #cba6f7
inactive_tab_foreground  #cdd6f4
inactive_tab_background  #181825
# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8

# ---- Keybindings ----
# Splits (great for running Claude Code beside an editor)
map ctrl+shift+enter  launch --location=vsplit --cwd=current
map ctrl+alt+enter    launch --location=hsplit --cwd=current
map ctrl+shift+left   neighboring_window left
map ctrl+shift+right  neighboring_window right
map ctrl+shift+up     neighboring_window up
map ctrl+shift+down   neighboring_window down
# Tabs open in current dir
map ctrl+shift+t      new_tab_with_cwd
# Font size
map ctrl+shift+equal   change_font_size all +1.0
map ctrl+shift+minus   change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
# Transparency (live): more / less / reset
map ctrl+shift+]      set_background_opacity +0.05
map ctrl+shift+[      set_background_opacity -0.05
map ctrl+shift+0      set_background_opacity default
