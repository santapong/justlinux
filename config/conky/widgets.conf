# Desktop widgets — edited by Hypr Settings (ALT+X → Widgets) or by hand.
# on/off per widget; cards = border + background panels behind widgets.
clock=on
stats=on
calendar=on
claude=on
# apps: pinned-application dock (pins = Hypr Launcher ★ favorites, ALT+R right-click)
apps=on
pet=on
# new widget fleet (July 2026)
weather=on
nowplaying=on
pomodoro=on
notes=on
security=on
netgraph=on
github=on
habitica=on
trading=on
# widget parameters
github_user=santapong
trading_coins=bitcoin,ethereum
nowplaying_pos=bottom_left
nowplaying_x=24
nowplaying_y=68
security_pos=top_right
security_x=24
security_y=210
pomodoro_pos=top_left
pomodoro_x=24
pomodoro_y=270
# per-widget position: <name>_pos (conky alignment name) + <name>_x/_y offsets
clock_pos=top_right
clock_x=24
clock_y=44
stats_pos=middle_right
stats_x=24
stats_y=0
calendar_pos=top_left
calendar_x=24
calendar_y=44
claude_pos=bottom_right
claude_x=24
claude_y=68
apps_pos=bottom_middle
apps_x=0
apps_y=12
# pet_layer: bottom = under windows (desktop), top = above windows
pet_layer=bottom
# claude_pet: Clawd, the orange Claude starburst mascot, wanders too
claude_pet=on
cards=on
