# Desktop widgets — edited by Hypr Settings (ALT+X → Widgets) or by hand.
# on/off per widget; cards = border + background panels behind widgets.
clock=on
stats=on
calendar=on
claude=on
# apps: pinned-application dock (pins = Hypr Launcher ★ favorites, ALT+R right-click)
apps=on
pet=on
# new widget fleet (July 2026)
weather=on
nowplaying=on
notes=on
security=on
netgraph=on
github=on
trading=on
# widget parameters
github_user=santapong
trading_coins=bitcoin,ethereum
nowplaying_pos=bottom_left
nowplaying_x=24
nowplaying_y=68
security_pos=top_right
security_x=24
security_y=200
# per-widget position: <name>_pos (conky alignment name) + <name>_x/_y offsets
