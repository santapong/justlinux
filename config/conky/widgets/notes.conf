-- Sticky notes — edit with hypr-notes
local card = dofile(os.getenv("HOME") .. "/.config/conky/card.lua")
local C = card.colors()

conky.config = card.apply({
    out_to_wayland = true,
    out_to_x = false,
    update_interval = 5,

    minimum_width = 260,

    font = 'JetBrainsMono Nerd Font:size=11',
    default_color = C.fg,
    color1 = C.accent2,
    color2 = C.fg,
    color3 = C.sub,
    color4 = C.good,
    color5 = C.bad,

    own_window_argb_visual = true,
    own_window_argb_value = 0,
    draw_shades = false,
    background = false,
}, C.bg)
card.place(conky.config, 'notes', 'middle_left', 24, 120)

conky.text = [[
${color1}󰎞  NOTES${color}${alignr}${color3}hypr-notes to edit${color}
${color3}${hr}${color}
${execi 5 [ -s ~/.local/share/hypr-notes.txt ] && head -12 ~/.local/share/hypr-notes.txt | cut -c1-38 || echo 'run hypr-notes to start'}
]]
