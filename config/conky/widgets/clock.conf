-- Big clock + date — top right of the desktop
local card = dofile(os.getenv("HOME") .. "/.config/conky/card.lua")
local C = card.colors()

conky.config = card.apply({
    out_to_wayland = true,
    out_to_x = false,
    update_interval = 1,

    minimum_width = 340,

    font = 'JetBrainsMono Nerd Font:size=12',
    default_color = C.fg,
    color1 = C.accent2,
    color2 = C.fg,
    color3 = C.sub,
    color4 = C.good,
    color5 = C.bad,

    own_window_argb_visual = true,
    own_window_argb_value = 0,
    draw_shades = false,
    draw_outline = false,
    background = false,
}, C.bg)
card.place(conky.config, 'clock', 'top_right', 24, 44)

conky.text = [[
${font JetBrainsMono Nerd Font:bold:size=52}${alignr}${time %H:%M}${font}
${alignr}${color1}${time %A}${color}  ${color2}${time %d %B %Y}${color}
]]
