-- Month calendar with today highlighted — top left
local card = dofile(os.getenv("HOME") .. "/.config/conky/card.lua")
local C = card.colors()

conky.config = card.apply({
    out_to_wayland = true,
    out_to_x = false,
    update_interval = 300,

    minimum_width = 240,

    font = 'JetBrainsMono Nerd Font:size=12',
    default_color = C.fg,
    color1 = C.accent2,
    color2 = C.fg,
    color3 = C.sub,
    color4 = C.good,
    color5 = C.bad,

    own_window_argb_visual = true,
    own_window_argb_value = 0,
    draw_shades = false,
    background = false,
}, C.bg)
card.place(conky.config, 'calendar', 'top_left', 24, 44)

conky.text = [[
${execpi 300 ~/.local/bin/conky-cal.sh}
]]
