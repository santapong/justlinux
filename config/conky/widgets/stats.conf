-- System stats — right side, under the clock
local card = dofile(os.getenv("HOME") .. "/.config/conky/card.lua")
local C = card.colors()

-- coretemp's hwmon index shifts between boots — resolve it at startup
local hwmon = "0"
for i = 0, 9 do
    local f = io.open("/sys/class/hwmon/hwmon" .. i .. "/name")
    if f then
        local n = f:read("*l"); f:close()
        if n == "coretemp" then hwmon = tostring(i); break end
    end
end

conky.config = card.apply({
    out_to_wayland = true,
    out_to_x = false,
    update_interval = 5,

    minimum_width = 300,

    font = 'JetBrainsMono Nerd Font:size=11',
    default_color = C.fg,
    color1 = C.accent2,
    color2 = C.fg,
    color3 = C.sub,
    color4 = C.good,
    color5 = C.bad,

    default_bar_width = 300,
    default_bar_height = 6,

    own_window_argb_visual = true,
    own_window_argb_value = 0,
    draw_shades = false,
    background = false,

    top_name_width = 14,
}, C.bg)
card.place(conky.config, 'stats', 'middle_right', 24, 0)

conky.text = [[
${color1} CPU${color}${alignr}${cpu cpu0}%  ·  ${hwmon ]] .. hwmon .. [[ temp 1}°C
${color3}${cpubar cpu0}${color}
${color1} RAM${color}${alignr}${mem} / ${memmax}
${color3}${membar}${color}
${color1} DISK /${color}${alignr}${fs_used /} / ${fs_size /}
${color3}${fs_bar /}${color}
${color1}󰖩 WLAN${color}${alignr}${downspeed wlan0} ↓  ${upspeed wlan0} ↑
${color3}${hr}${color}
${color1}top${color}  ${top name 1}${alignr}${top cpu 1}%
${color3}     ${top name 2}${alignr}${top cpu 2}%${color}
]]
