-- Network graphs (conky builtin)
local card = dofile(os.getenv("HOME") .. "/.config/conky/card.lua")
local C = card.colors()

conky.config = card.apply({
    out_to_wayland = true,
    out_to_x = false,
    update_interval = 2,

    minimum_width = 300,

    font = 'JetBrainsMono Nerd Font:size=10',
    default_color = C.fg,
    color1 = C.accent2,
    color2 = C.fg,
    color3 = C.sub,
    color4 = C.good,
    color5 = C.bad,

    own_window_argb_visual = true,
    own_window_argb_value = 0,
    draw_shades = false,
    background = false,
}, C.bg)
card.place(conky.config, 'netgraph', 'bottom_left', 24, 180)

conky.text = [[
${color1}󰖩  NETWORK · wlan0${color}${alignr}${color3}▼ ${color2}${downspeed wlan0}${color}
${color1}${downspeedgraph wlan0 28,300}${color}
${color3}▲ ${color2}${upspeed wlan0}${color}
${color1}${upspeedgraph wlan0 18,300}${color}
]]
