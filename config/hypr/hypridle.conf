# hypridle — auto-lock and screen power management.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid launching multiple hyprlocks
    before_sleep_cmd = loginctl lock-session     # lock before the system sleeps
    after_sleep_cmd = hyprctl dispatch dpms on   # turn screens back on after wake
}

# Lock the screen after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the monitors off after 10 minutes idle (saves power); on again when you move
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
