# ============================================================
#  hyprexpo — exposé-style workspace overview (OPTIONAL)
#
#  This file is NOT sourced by default because it needs the plugin:
#      hyprpm update
#      hyprpm add https://github.com/hyprwm/hyprland-plugins
#      hyprpm enable hyprexpo
#  Then uncomment the source line in hyprland.conf (search "hyprexpo").
#
#  ALT+TAB → toggle the overview grid; click a workspace to jump.
# ============================================================

plugin {
    hyprexpo {
        columns = 3
        gap_size = 8
        bg_col = rgb(101017)
        workspace_method = first 1

        enable_gesture = true
        gesture_fingers = 3
        gesture_distance = 300
        gesture_positive = true
    }
}

bind = $mod, TAB, hyprexpo:expo, toggle
