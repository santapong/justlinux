# hyprexpo — zoomed-out workspace overview grid.
# NOT sourced until the plugin is installed (hyprpm enable hyprexpo);
# hyprland.conf gains a `source` line for this file at that point.
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = $wallbg
        workspace_method = center current
    }
}

# ALT + ` (grave, left of 1) — toggle the overview
bind = $mod, grave, hyprexpo:expo, toggle
