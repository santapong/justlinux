# ============================================================
#  Hyprland config — starter setup for Kali (Intel UHD 630)
#  Docs: https://wiki.hyprland.org/Configuring/
# ============================================================

# ---- Wallpaper-matched colors (generated by wallust) ----
source = ~/.config/hypr/colors.conf

# ---- Monitors ----
# Explicit 3-monitor layout, matching the previous XFCE arrangement.
# Format:  monitor = NAME, RESOLUTION@HZ, POSITION_XxY, SCALE
# List outputs / verify names with:  hyprctl monitors
monitor = DP-1,     1600x900@60, 0x0,    1
monitor = HDMI-A-2, 1600x900@60, 1600x0, 1
monitor = HDMI-A-1, 1600x900@60, 0x900,  1

# Fallback for any other monitor you plug in later (auto-place to the right)
monitor = , preferred, auto, 1

# Workspaces live on fixed monitors (1-4 main, 5-7 top-right, 8-10 bottom)
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:HDMI-A-2
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# ---- Programs (edit to taste) ----
$terminal   = kitty
$menu       = rofi -show drun
$filemgr    = thunar

# ---- Input method (fcitx5, Thai + English toggle) ----
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus

# ---- Autostart ----
exec-once = fcitx5 -d
exec-once = waybar
exec-once = hyprpaper
exec-once = swaync                        # notification daemon + control center
exec-once = lxpolkit                      # GUI password prompts (polkit agent)
exec-once = nm-applet --indicator         # network tray icon
exec-once = hypridle                      # auto-lock / screen-off on idle
exec-once = ~/.local/bin/desktop-widgets.sh start   # conky desktop widgets (clock/stats/calendar/claude)

# ---- Environment ----
env = LANG,en_US.UTF-8                    # SDDM doesn't set a locale for Wayland sessions
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # VS Code & friends run native Wayland (crisp, no XWayland)

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# ---- General look ----
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = $wallaccent $wallaccent2 45deg
    col.inactive_border = $wallmuted
    layout = dwindle
    resize_on_border = true
}

# Window groups (ALT+G "tabs") — make the active tab obvious
group {
    col.border_active = $wallaccent $wallaccent2 45deg
    col.border_inactive = $wallmuted
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 16
        col.active = $wallaccent
        col.inactive = $wallbg
        text_color = $wallfg
    }
}

decoration {
    rounding = 8
    # Blur is the heaviest effect on an iGPU. Turn off if it ever feels sluggish.
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    key_press_enables_dpms = true         # any key wakes sleeping screens
    # terminal hides behind GUI apps it launches, returns when they close
    # (only plain `kitty` — floatterm/hyprlauncher/dropterm have other classes)
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

binds {
    workspace_back_and_forth = true       # ALT+2 twice = bounce back
}

general:snap {
    enabled = true                        # floating windows snap to edges
}

# ============================================================
#  Keybindings  ($mod = ALT)
# ============================================================
$mod = ALT

bind = $mod, Q, exec, $terminal
bind = $mod, C, killactive
# ALT+M now opens the Power page (one keystroke must not kill the session);
# the real exit moved behind SHIFT
bind = $mod, M, exec, ~/.local/bin/hypr-tools.sh power
bind = $mod SHIFT, M, exit
bind = $mod, E, exec, $filemgr
bind = $mod, R, exec, ~/.local/bin/hypr-tools.sh apps      # app launcher (Hypr Launcher UI)
bind = $mod, W, exec, ~/.local/bin/hypr-tools.sh windows   # window switcher (Hypr Launcher UI)
bind = $mod, H, exec, ~/.local/bin/hypr-tools.sh windows   # window overview: every workspace + restore hidden/stashed windows
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, P, pseudo                   # pseudo-tile the active window
bind = $mod, L, exec, hyprlock          # lock the screen
bind = $mod, ESCAPE, exec, ~/.local/bin/hypr-tools.sh power   # Hypr Settings → Power page (lock/logout/reboot/shutdown)
bind = $mod, N, exec, swaync-client -t -sw   # toggle notification center
bind = $mod SHIFT, F, exec, ~/.local/bin/focus-mode.sh toggle  # focus session: DND + countdown card
bind = $mod SHIFT, W, exec, ~/.local/bin/wallpaper.sh   # random wallpaper + recolor desktop
bind = $mod, K,       exec, ~/.local/bin/hypr-tools.sh keys   # keybinding cheat sheet / editor
bind = $mod, D,       exec, ~/.local/bin/hypr-tools.sh        # hypr-tools main menu
bind = $mod, X,       exec, ~/.local/bin/hypr-tools.sh settings # Hypr Settings — click & pick control panel
bind = $mod, B,       exec, ~/.local/bin/bar-toggle.sh        # show/hide top bar (pins open during auto-hide)
bind = $mod, T,       exec, ~/.local/bin/hypr-tools.sh remind # set a quick reminder
bind = $mod, A,       exec, ~/.local/bin/hypr-tools.sh stash  # hide/unhide all windows on this workspace
bind = $mod SHIFT, A, exec, ~/.local/bin/hypr-tools.sh hide-window    # hide (minimize) the focused window
bind = $mod CTRL, A,  exec, ~/.local/bin/hypr-tools.sh unhide-window  # pick a hidden window to bring back
bind = $mod, U,       exec, ~/.local/bin/drop-term    # dropdown terminal (toggle)
bind = $mod SHIFT, U, exec, ~/.local/bin/drop-claude  # dropdown Claude (AI terminal, toggle)
bind = $mod CTRL, U,  exec, ~/.local/bin/hypr-claude-studio  # Claude Studio: tabs + session tree (VS Code style)
bind = $mod CTRL, D,  exec, ~/.local/bin/hypr-docker          # Docker control panel (containers, logs, pull)
bind = $mod CTRL, O,  exec, ~/.local/bin/desktop-widgets.sh toggle-office  # toggle the Claude office (grid or floor per office_layout)
bind = $mod CTRL, H,  exec, ~/.local/bin/hypr-tools.sh claude-recall  # search every past Claude conversation
bind = $mod CTRL, K,  exec, kitty --class hyprkanban -e ~/.local/bin/hypr-kanban  # Habitica board
bind = $mod, Y,       exec, ~/.local/bin/pick-color   # click a pixel → hex to clipboard
bind = $mod SHIFT, Y, exec, ~/.local/bin/hypr-viz     # ambient audio visualizer (toggle)
bind = $mod SHIFT, N, exec, ~/.local/bin/claude-select.sh  # selection → Claude actions (explain/fix/translate)

# Monitors (3-head): hop focus / throw window to the next screen
bind = $mod, O,       focusmonitor, +1
bind = $mod SHIFT, O, movewindow, mon:+1

bind = $mod SHIFT, E, exec, ~/.local/bin/hypr-arrange # widget grid edit mode (drag cards)
bind = $mod, I,       exec, ~/.local/bin/ocr-region   # select region → its TEXT to clipboard
bind = $mod SHIFT, I, exec, ~/.local/bin/claude-vision.sh  # select region → Claude EXPLAINS it (vision)
bind = $mod, Z,       exec, ~/.local/bin/hypr-project # open a whole project across workspaces

# Media keys (MPRIS via D-Bus — works with Chromium/Spotify/mpv)
bindl = , XF86AudioPlay,  exec, ~/.local/bin/media-ctl play-pause
bindl = , XF86AudioNext,  exec, ~/.local/bin/media-ctl next
bindl = , XF86AudioPrev,  exec, ~/.local/bin/media-ctl prev

# Move focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# ALT+TAB — cycle windows (like the classic Alt-Tab)
bind = $mod, TAB, cyclenext
bind = $mod, TAB, bringactivetotop

# Move the active window within the layout
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize the active window (hold to repeat)
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# Scratchpad — a hidden workspace that overlays on demand
bind = $mod, S,      togglespecialworkspace, magic
bind = $mod CTRL, S, movetoworkspace, special:magic

# Scroll through workspaces with mod + mouse wheel
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Window groups (tabbed windows): toggle, then cycle tabs
bind = $mod, G,         togglegroup
bind = $mod SHIFT, TAB, changegroupactive, f

# Workspaces (switch)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---- Window rules ----
# (0.53+ syntax: "field value" pairs + match: selectors)
# Floating utility terminals (system monitor, firewall rules, virus scans, …)
windowrule = float on, size 1280 760, center on, match:class ^(floatterm)$
# Volume control: same treatment
windowrule = float on, size 900 620, center on, match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$
# ClamTk antivirus GUI: floating + centered (keeps its natural size)
windowrule = float on, center on, match:class ^(clamtk)$
# Dropdown terminal: wide strip pinned to the top of the screen
windowrule = float on, size 1560 500, move 20 40, match:class ^(dropterm)$
# App-dock picker window (choose pinned apps per workspace): centered float
windowrule = float on, size 460 560, center on, match:class ^(hyprdockpick)$
# Hypr Launcher (apps/windows/wallpaper/tools pickers): centered float
windowrule = float on, size 900 580, center on, match:class ^(hyprlauncher)$
# Widget picker (template gallery + instance manager): centered float
windowrule = float on, size 780 580, center on, match:class ^(hyprwidgetpick)$
# Claude selection/vision result floats
windowrule = float on, size 900 560, center on, match:class ^(hyprclaude)$
# Claude Studio: big summonable float (ALT+CTRL+U brings it to you)
windowrule = float on, size 1440 820, center on, match:class ^(hyprclaudestudio)$
windowrule = float on, size 1360 780, center on, match:class ^(hyprdocker)$
windowrule = float on, size 1100 640, center on, match:class ^(hyprdockerexec)$
# the board now carries a week view: eight columns need the width
windowrule = float on, size 1520 820, center on, match:class ^(hyprkanban)$
# Apps & Tools grids get a wider window so 6 columns of boxes fit
windowrule = float on, size 1280 720, center on, match:class ^(hyprlauncher)$, match:title ^(Hypr Apps|Hypr Tools)$

# Blur behind the power menu (wlogout)
layerrule = blur on, match:namespace logout_dialog
# Frosted-glass desktop widgets: blur the card panels, skip transparent gaps
layerrule = blur on, match:namespace conky_namespace
layerrule = ignore_alpha 0.3, match:namespace conky_namespace
layerrule = blur on, match:namespace ^(hypr-appdock.*)$
layerrule = ignore_alpha 0.3, match:namespace ^(hypr-appdock.*)$
# smart bar: faded-out (hidden) waybar must not eat desktop clicks
layerrule = ignore_alpha 0.2, match:namespace waybar
# Glass widget cards (hypr-cardhost)
layerrule = blur on, match:namespace ^(hypr-card-.*)$
layerrule = ignore_alpha 0.3, match:namespace ^(hypr-card-.*)$
# Ambient audio visualizer
layerrule = blur on, match:namespace ^(hypr-viz)$
layerrule = ignore_alpha 0.3, match:namespace ^(hypr-viz)$
# Claude office scene
layerrule = blur on, match:namespace ^(hypr-office)$
layerrule = ignore_alpha 0.3, match:namespace ^(hypr-office)$
layerrule = blur on, match:namespace ^(hypr-office2d)$
layerrule = ignore_alpha 0.3, match:namespace ^(hypr-office2d)$

# Screenshots — saved to ~/Pictures/Screenshots AND copied, with notification
bind = $mod SHIFT, S, exec, ~/.local/bin/screenshot.sh region   # drag-select a region (like Win+Shift+S)
bind = , PRINT,       exec, ~/.local/bin/screenshot.sh region   # drag-select a region
bind = SHIFT, PRINT,  exec, ~/.local/bin/screenshot.sh screen   # the monitor you're on
bind = CTRL, PRINT,   exec, ~/.local/bin/screenshot.sh all      # all three monitors

# Volume (wireplumber) — repeat while held
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ============================================================
#  hyprbars plugin — window title bars with buttons
#  Buttons (right to left): close / maximize / float
# ============================================================
plugin = /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprbars.so

plugin {
    hyprbars {
        bar_height = 26
        bar_color = $wallbg
        col.text = $wallfg
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        bar_padding = 10
        bar_button_padding = 8
        bar_precedence_over_border = true
        # double-click the title bar → maximize (keeps waybar + gaps);
        # double-click again restores. fullscreen 1 is a toggle.
        on_double_click = hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(f38ba8), 14, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f9e2af), 14, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(a6e3a1), 14, 󰐃, hyprctl dispatch togglefloating
    }
}

# Idle-lock policy: NO blanket fullscreen inhibit. Hyprland's
# `idle_inhibit fullscreen` also fires on MAXIMIZE (mode 1), so with
# double-click-to-maximize a maximized window would silently defeat the
# 5-min auto-lock. Instead we rely on apps' own idle inhibitors — modern
# browsers (Chromium/Brave) and mpv signal the Wayland idle-inhibit
# protocol during actual video playback, which hypridle honors — so the
# screen still stays awake for video, but a maximized editor locks.

# Clipboard history — ALT+SHIFT+V opens picker with everything you copied
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store   # images too
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p "󰅍 Clipboard" | cliphist decode | wl-copy
