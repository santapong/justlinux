# hyprlock — lock screen. Test it any time with:  hyprlock
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$wallpaper = /home/santapong/Pictures/wallpaper/the-library-3840-2160.jpg

general {
    hide_cursor = true
    grace = 2               # seconds after lock during which a keypress unlocks without password
    ignore_empty_input = true
}

# Background image, blurred so text is readable — shown on every monitor
background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(205, 214, 244, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Password input box
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    outer_color = rgba(137, 180, 250, 0.8)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong — try again</i>
    position = 0, -60
    halign = center
    valign = center
}
