[template]
name = "trading"
label = "Markets"
icon = "󰋂"
description = "Crypto and stock prices, 24h change and sparkline — up to 7 symbols"
multi_instance = true
default_width = 300
default_pos = "bottom_middle"

[params.coins]
label = "Crypto (CoinGecko ids, comma separated)"
type = "string"
default = "bitcoin,ethereum"

[params.stocks]
label = "Stocks (tickers, e.g. AAPL,NVDA — max 7 symbols total)"
type = "string"
default = ""

[source]
cmd = "~/.local/bin/widget-trading.sh --fields --coins {coins} --stocks {stocks}"
interval = 300

[[rows]]
type = "title"
icon = "coins"
text = "MARKETS"
badge = "{cap}"

[[rows]]
type = "hr"

[[rows]]
type = "repeat"
over = "coin"
  [[rows.rows]]
  type = "keyval"
  key = "{coin.sym}"
  value = "{coin.price}"
  badge = "{coin.change}"
  [[rows.rows]]
  type = "sparkline"
  data = "{coin.spark}"
  height = 18
