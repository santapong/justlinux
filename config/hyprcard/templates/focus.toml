[template]
name = "focus"
label = "Focus session"
icon = "󰐰"
description = "Deep-work countdown: DND while it runs (ALT+SHIFT+F)"
default_width = 300
default_pos = "top_left"
# click the card to open the Habitica board
action = "kitty --class hyprkanban -e ~/.local/bin/hypr-kanban"

[source]
cmd = "~/.local/bin/widget-focus.sh --fields"
interval = 5

[[rows]]
type = "title"
icon = "alarm"
text = "FOCUS"
badge = "{remaining}"

[[rows]]
type = "hr"

[[rows]]
type = "bar"
value = "{pct}"

[[rows]]
type = "text"
text = "{label}"
ink = "sub"

[[rows]]
type = "hr"

[[rows]]
type = "keyval"
icon = "clock"
key = "this week"
value = "{week_total}"

[[rows]]
type = "sparkline"
data = "{week}"
height = 16
