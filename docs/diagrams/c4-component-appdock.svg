    <text x="515" y="118" font-size="13" font-weight="600" fill="#0b2545">EdgeStrip</text>
    <text x="515" y="133" font-size="10" font-style="italic" fill="#123a63">[GTK layer surface]</text>
    <text x="515" y="148" font-size="10" fill="#123a63">an invisible 4 px strip; a 180 ms dwell</text>
    <text x="515" y="160" font-size="10" fill="#123a63">separates resting on the edge from crossing</text>
    <text x="515" y="172" font-size="10" fill="#123a63">between stacked monitors</text>
  </g>
