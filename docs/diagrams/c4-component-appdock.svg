    <text x="185" y="118" font-size="13" font-weight="600" fill="#0b2545">Manager</text>
    <text x="185" y="133" font-size="10" font-style="italic" fill="#123a63">[Python]</text>
    <text x="185" y="148" font-size="10" fill="#123a63">owns everything: spawns docks per monitor,</text>
    <text x="185" y="160" font-size="10" fill="#123a63">debounces the socket2 stream, respawns on</text>
    <text x="185" y="172" font-size="10" fill="#123a63">hotplug, 5 s hide-sanity pass</text>
  </g>
  <rect x="390" y="96" width="250" height="120" rx="8" fill="#85bbf0"/>
