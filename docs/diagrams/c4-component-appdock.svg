    <text x="185" y="307" font-size="10" font-style="italic" fill="#123a63">[Python]</text>
    <text x="185" y="322" font-size="10" fill="#123a63">drives waybar, a FOREIGN surface with no GTK</text>
    <text x="185" y="334" font-size="10" fill="#123a63">crossing events: probes hyprctl layers,</text>
