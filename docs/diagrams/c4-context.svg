<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- C4 Level 1: System Context — justlinux desktop fleet.
       Inline attributes + polygon arrowheads only: renders identically in
       browsers, GitHub, and minimal SVG engines. Self-colored boxes and
       mid-gray connectors stay legible on light AND dark page themes. -->

  <text x="24" y="34" font-size="16" font-weight="700" fill="#888888">System Context — justlinux desktop (C4 level 1)</text>

  <!-- Person -->
  <circle cx="460" cy="66" r="18" fill="#08427b"/>
  <rect x="360" y="80" width="200" height="74" rx="8" fill="#08427b"/>
  <g text-anchor="middle">
    <text x="460" y="102" font-size="13" font-weight="600" fill="#ffffff">santapong</text>
    <text x="460" y="116" font-size="10" font-style="italic" fill="#d0e0f0">[Person]</text>
    <text x="460" y="134" font-size="11" fill="#eaf2fa">Drives the desktop with ALT binds,</text>
    <text x="460" y="148" font-size="11" fill="#eaf2fa">screen-edge hovers and TUI panels</text>
  </g>

  <!-- External: wallust (top right) -->
  <rect x="690" y="80" width="200" height="110" rx="6" fill="#8a8a8a" stroke="#7a7a7a"/>
  <g text-anchor="middle">
    <text x="790" y="104" font-size="13" font-weight="600" fill="#ffffff">wallust</text>
    <text x="790" y="118" font-size="10" font-style="italic" fill="#e2e2e2">[Tool — wallpaper → palette]</text>
    <text x="790" y="138" font-size="11" fill="#f0f0f0">Extracts a 16-color palette</text>
    <text x="790" y="152" font-size="11" fill="#f0f0f0">from the wallpaper; every</text>
    <text x="790" y="166" font-size="11" fill="#f0f0f0">surface re-themes live</text>
  </g>

  <!-- System in scope -->
  <rect x="300" y="240" width="320" height="128" rx="6" fill="#1168bd" stroke="#0e5aa7"/>
  <g text-anchor="middle">
    <text x="460" y="266" font-size="13" font-weight="600" fill="#ffffff">justlinux Desktop Fleet</text>
    <text x="460" y="280" font-size="10" font-style="italic" fill="#d0e0f0">[Software System]</text>
    <text x="460" y="300" font-size="11" fill="#eaf2fa">Glass widget cards, per-monitor app docks,</text>
    <text x="460" y="314" font-size="11" fill="#eaf2fa">smart auto-hide top bar, grid edit mode,</text>
    <text x="460" y="328" font-size="11" fill="#eaf2fa">TUI settings/launcher — one config file,</text>
    <text x="460" y="342" font-size="11" fill="#eaf2fa">wallpaper-driven theme</text>
  </g>

  <!-- External: Hyprland -->
  <rect x="40" y="470" width="240" height="120" rx="6" fill="#8a8a8a" stroke="#7a7a7a"/>
  <g text-anchor="middle">
    <text x="160" y="494" font-size="13" font-weight="600" fill="#ffffff">Hyprland 0.55</text>
    <text x="160" y="508" font-size="10" font-style="italic" fill="#e2e2e2">[Software System — Wayland compositor]</text>
    <text x="160" y="528" font-size="11" fill="#f0f0f0">Hosts every surface via layer-shell;</text>
    <text x="160" y="542" font-size="11" fill="#f0f0f0">hyprctl queries + socket2 events;</text>
    <text x="160" y="556" font-size="11" fill="#f0f0f0">layerrules (blur, ignore_alpha)</text>
  </g>

  <!-- External: data APIs -->
  <rect x="340" y="470" width="240" height="120" rx="6" fill="#8a8a8a" stroke="#7a7a7a"/>
  <g text-anchor="middle">
    <text x="460" y="494" font-size="13" font-weight="600" fill="#ffffff">External data APIs</text>
    <text x="460" y="508" font-size="10" font-style="italic" fill="#e2e2e2">[Software Systems]</text>
    <text x="460" y="528" font-size="11" fill="#f0f0f0">github.com · api.coingecko.com</text>
    <text x="460" y="542" font-size="11" fill="#f0f0f0">wttr.in · api.anthropic.com</text>
    <text x="460" y="556" font-size="11" fill="#f0f0f0">feed the widget cards</text>
  </g>

  <!-- External: waybar -->
  <rect x="640" y="470" width="240" height="120" rx="6" fill="#8a8a8a" stroke="#7a7a7a"/>
  <g text-anchor="middle">
    <text x="760" y="494" font-size="13" font-weight="600" fill="#ffffff">waybar 0.15</text>
    <text x="760" y="508" font-size="10" font-style="italic" fill="#e2e2e2">[Software System — status bar]</text>
    <text x="760" y="528" font-size="11" fill="#f0f0f0">Top panel on every monitor.</text>
    <text x="760" y="542" font-size="11" fill="#f0f0f0">SIGUSR1 toggles shown/hidden;</text>
    <text x="760" y="556" font-size="11" fill="#f0f0f0">.hidden CSS class fades it out</text>
  </g>

  <!-- Relationships: elbow lines, gaps under labels, polygon arrowheads -->
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <path d="M 460 154 L 460 170"/>
    <path d="M 460 202 L 460 238"/>
    <path d="M 580 240 L 580 210 L 790 210 L 790 192"/>
    <path d="M 360 368 L 360 430 L 160 430 L 160 468"/>
    <path d="M 460 368 L 460 398"/>
    <path d="M 460 432 L 460 468"/>
    <path d="M 560 368 L 560 430 L 760 430 L 760 468"/>
  </g>
  <g fill="#888888">
    <polygon points="455,231 465,231 460,240"/>
    <polygon points="785,201 795,201 790,192"/>
    <polygon points="155,461 165,461 160,470"/>
    <polygon points="455,461 465,461 460,470"/>
    <polygon points="755,461 765,461 760,470"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#888888">
    <text x="460" y="184">glances, clicks, drags,</text>
    <text x="460" y="198">ALT-key drives</text>
    <text x="686" y="204">runs on wallpaper change</text>
    <text x="255" y="410">hyprctl + socket2 events,</text>
    <text x="255" y="424">layer-shell surfaces</text>
    <text x="460" y="412">polls over HTTPS</text>
    <text x="460" y="426">(cached, stale-marked)</text>
    <text x="668" y="410">smart bar: SIGUSR1</text>
    <text x="668" y="424">reveal / tuck away</text>
  </g>

  <!-- Legend -->
  <rect x="24" y="620" width="14" height="14" fill="#1168bd"/>
  <text x="44" y="631" font-size="11" fill="#888888">system in scope</text>
  <rect x="160" y="620" width="14" height="14" fill="#8a8a8a"/>
  <text x="180" y="631" font-size="11" fill="#888888">external</text>
</svg>
