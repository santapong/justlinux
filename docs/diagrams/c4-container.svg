  <text x="994" y="770" font-size="10" text-anchor="start" fill="#888888">opens and reads</text>
  <text x="60" y="960" font-size="10" text-anchor="start" fill="#888888">Two rules hold it together. One config file: everything user-tunable lives in widgets.conf and every write goes through one atomic writer.</text>
  <text x="60" y="973" font-size="10" text-anchor="start" fill="#888888">One process per concern over one library: every GTK surface is a hyprdesk.layer.LayerWindow themed by hyprdesk.theme, so the desktop re-colours together.</text>
  <text x="60" y="986" font-size="10" text-anchor="start" fill="#888888">Terminal panels take the palette and the ink hierarchy but never the pixel icons — Textual and tmux draw characters, not sprites.</text>
