  <text x="994" y="845" font-size="10" text-anchor="start" fill="#888888">opens and reads</text>
  <text x="60" y="1030" font-size="10" text-anchor="start" fill="#888888">Two rules hold it together. One config file: everything user-tunable lives in widgets.conf and every write goes through one atomic writer.</text>
  <text x="60" y="1043" font-size="10" text-anchor="start" fill="#888888">One process per concern over one SHARED CONTRACT: palette roles, conf grammar, ctl verbs and layer namespaces are identical in both languages,</text>
  <text x="60" y="1056" font-size="10" text-anchor="start" fill="#888888">so the desktop re-colours together. Terminal panels take the palette and the ink hierarchy but never the pixel icons.</text>
