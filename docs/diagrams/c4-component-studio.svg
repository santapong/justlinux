    <text x="495" y="148" font-size="10" fill="#123a63">the session tree: Enter opens a tab, s opens</text>
    <text x="495" y="160" font-size="10" fill="#123a63">one beside it, t a terminal, m the settings</text>
    <text x="495" y="172" font-size="10" fill="#123a63">panel</text>
