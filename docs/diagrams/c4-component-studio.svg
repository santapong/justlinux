    <text x="805" y="148" font-size="10" fill="#123a63">the fleet&#x27;s colours, the per-tab close button,</text>
    <text x="805" y="160" font-size="10" fill="#123a63">the split buttons; idempotent, so it re-runs</text>
    <text x="805" y="172" font-size="10" fill="#123a63">on every start</text>
