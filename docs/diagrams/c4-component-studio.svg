    <text x="185" y="148" font-size="10" fill="#d0e0f0">focuses the existing window and summons it to</text>
    <text x="185" y="160" font-size="10" fill="#d0e0f0">this workspace, or spawns kitty running tmux</text>
  </g>
  <rect x="370" y="96" width="250" height="110" rx="8" fill="#85bbf0"/>
