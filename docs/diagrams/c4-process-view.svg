  <text x="40" y="470" font-size="10" text-anchor="start" fill="#888888">Contracts every process honours:</text>
  <text x="40" y="483" font-size="10" text-anchor="start" fill="#888888">  - ctl sockets answer ok/err and PROBE-EXIT if another instance owns the endpoint (no duplicate fleets)</text>
  <text x="40" y="496" font-size="10" text-anchor="start" fill="#888888">  - USR1 = reposition, USR2 = retheme, everywhere a surface can move or re-ink</text>
  <text x="40" y="509" font-size="10" text-anchor="start" fill="#888888">  - conf writes: flock + tmp + rename, undo file kept; readers grep key=value (NO spaces — measured trap)</text>
  <text x="40" y="522" font-size="10" text-anchor="start" fill="#888888">  - process guards match BOTH cmdline forms (python3 &lt;path&gt; and &lt;path&gt;) with pgrep/pkill -xf, never -f</text>
  <text x="40" y="535" font-size="10" text-anchor="start" fill="#888888">  - async child streams carry generation tokens: a superseded fetch can never write into the pane it lost</text>
  <text x="40" y="720" font-size="10" text-anchor="start" fill="#888888">Wake sources, not busy loops: calloop timers (cardhost 1 s, appdock 200 ms), tmux/ratatui event polls,</text>
  <text x="40" y="733" font-size="10" text-anchor="start" fill="#888888">socket2 line events. Total resident cost, measured 4 Aug 2026: 4.65% CPU / 64 MB.</text>
