  </g>
  <text x="40" y="400" font-size="10" text-anchor="start" fill="#888888">Install is one script: install.sh copies configs and python, then cargo-builds the workspace and installs binaries over the python twins.</text>
  <text x="40" y="413" font-size="10" text-anchor="start" fill="#888888">A box without cargo still works - it simply keeps the python fleet. That is the whole portability story, and why the python twins stay in bin/.</text>
  <text x="40" y="500" font-size="10" text-anchor="start" fill="#888888">Layer discipline: a display-only surface has an EMPTY input region; an interactive one claims exactly its pixels.</text>
  <text x="40" y="513" font-size="10" text-anchor="start" fill="#888888">A stretch-anchored surface must adopt the configure-granted size before drawing - a wayland surface IS its buffer (the 1 px strip trap, v1.3.0).</text>
</svg>
